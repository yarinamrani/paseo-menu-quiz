<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבחן תפריט פסאו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --olive: #5B7A5E;
    --olive-dark: #3d5340;
    --gold: #C4A265;
    --gold-light: #d4b87a;
    --cream: #F5F0E8;
    --cream-dark: #e8e0d2;
    --charcoal: #2a2a2a;
    --correct: #4a8c5c;
    --wrong: #c0392b;
    --bg: #faf8f4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--charcoal);
    min-height: 100vh;
  }

  .app {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    padding-bottom: 40px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 20px 30px;
    margin-bottom: 30px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-radius: 20px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -30%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(196,162,101,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  .header-logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: 0 auto 12px;
    display: block;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .header h1 {
    font-family: 'Rubik', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .header .subtitle {
    font-size: 0.95rem;
    opacity: 0.85;
    font-weight: 300;
  }

  /* Progress bar */
  .progress-container {
    background: var(--cream);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .progress-bar-bg {
    flex: 1;
    height: 8px;
    background: var(--cream-dark);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--olive), var(--gold));
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .progress-text {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--olive-dark);
    white-space: nowrap;
    min-width: 60px;
    text-align: center;
  }

  /* Question card */
  .question-card {
    background: white;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    margin-bottom: 20px;
    animation: slideIn 0.35s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .question-category {
    display: inline-block;
    background: var(--cream);
    color: var(--olive-dark);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }
  .question-text {
    font-family: 'Rubik', sans-serif;
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.7;
    margin-bottom: 22px;
    color: var(--charcoal);
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 18px;
    background: var(--bg);
    border: 2px solid transparent;
    border-radius: 12px;
    font-family: 'Heebo', sans-serif;
    font-size: 0.95rem;
    color: var(--charcoal);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: right;
    line-height: 1.5;
  }
  .option-btn:hover:not(.disabled) {
    border-color: var(--gold-light);
    background: var(--cream);
  }
  .option-letter {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--olive);
    transition: all 0.2s ease;
  }
  .option-btn.selected-correct {
    border-color: var(--correct);
    background: #edf7ef;
  }
  .option-btn.selected-correct .option-letter {
    background: var(--correct);
    color: white;
  }
  .option-btn.selected-wrong {
    border-color: var(--wrong);
    background: #fdf0ee;
  }
  .option-btn.selected-wrong .option-letter {
    background: var(--wrong);
    color: white;
  }
  .option-btn.show-correct {
    border-color: var(--correct);
    background: #edf7ef;
  }
  .option-btn.show-correct .option-letter {
    background: var(--correct);
    color: white;
  }
  .option-btn.disabled { cursor: default; opacity: 0.7; }
  .option-btn.disabled.selected-correct,
  .option-btn.disabled.selected-wrong,
  .option-btn.disabled.show-correct { opacity: 1; }

  /* Explanation */
  .explanation {
    margin-top: 18px;
    padding: 14px 18px;
    background: var(--cream);
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--olive-dark);
    border-right: 4px solid var(--gold);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  /* Navigation */
  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border: none;
    border-radius: 12px;
    font-family: 'Heebo', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 8px;
  }
  .nav-btn.primary {
    background: var(--olive);
    color: white;
  }
  .nav-btn.primary:hover { background: var(--olive-dark); }
  .nav-btn.secondary {
    background: var(--cream);
    color: var(--olive-dark);
  }
  .nav-btn.secondary:hover { background: var(--cream-dark); }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }

  /* Results */
  .results-card {
    background: white;
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    text-align: center;
    animation: slideIn 0.4s ease;
  }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 0 auto 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Rubik', sans-serif;
    border: 6px solid;
  }
  .score-circle.pass {
    border-color: var(--correct);
    background: #edf7ef;
    color: var(--correct);
  }
  .score-circle.fail {
    border-color: var(--wrong);
    background: #fdf0ee;
    color: var(--wrong);
  }
  .score-number { font-size: 2.5rem; font-weight: 900; line-height: 1; }
  .score-label { font-size: 0.8rem; font-weight: 500; margin-top: 4px; }
  .results-title {
    font-family: 'Rubik', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .results-subtitle {
    font-size: 0.95rem;
    color: #777;
    margin-bottom: 28px;
    line-height: 1.6;
  }

  /* Category breakdown */
  .category-breakdown {
    text-align: right;
    margin: 24px 0;
    padding: 20px;
    background: var(--bg);
    border-radius: 14px;
  }
  .category-breakdown h3 {
    font-size: 0.95rem;
    margin-bottom: 14px;
    color: var(--olive-dark);
  }
  .cat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--cream-dark);
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-score { font-weight: 700; }
  .cat-score.good { color: var(--correct); }
  .cat-score.bad { color: var(--wrong); }

  /* Start screen */
  .start-card {
    background: white;
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    text-align: center;
  }
  .start-card h2 {
    font-family: 'Rubik', sans-serif;
    font-size: 1.3rem;
    margin-bottom: 16px;
  }
  .start-info {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin: 20px 0 28px;
    flex-wrap: wrap;
  }
  .info-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .info-num {
    font-family: 'Rubik', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--olive);
  }
  .info-label { font-size: 0.8rem; color: #888; }

  .topics-list {
    text-align: right;
    margin: 0 auto 24px;
    max-width: 320px;
  }
  .topic-tag {
    display: inline-block;
    background: var(--cream);
    color: var(--olive-dark);
    font-size: 0.8rem;
    padding: 5px 14px;
    border-radius: 20px;
    margin: 3px;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const QUIZ_SIZE = 20;
const QUESTIONS = [
  // ===== אלרגנים וכשרות =====
  {category:"אלרגנים וכשרות",question:"לקוח שואל אם המטבח נקי מגלוטן. מה עונים?",options:["כן, נקי לחלוטין מכל אלרגן","רק מנות הסושי בטוחות","לא נקי, אך יש לחם ללא גלוטן בתוספת תשלום","אין אופציה ללקוחות רגישים"],correct:2,explanation:"המטבח אינו נקי מאלרגנים (אגוזים, גלוטן וכו'). יש לחם ללא גלוטן בתוספת תשלום. חשוב לוודא שהאלרגיה אינה מסכנת חיים — אם כן, לפנות למנהל משמרת."},
  {category:"אלרגנים וכשרות",question:"לקוח צליאקי מזמין צ'יפס. מה חשוב לציין?",options:["הצ'יפס מטוגן בציפסר לא סטרילי מגלוטן","הצ'יפס ללא גלוטן, אפשר להגיש","הצ'יפס מכיל גלוטן בציפוי שלו","צ'יפס לא קיים בתפריט"],correct:0,explanation:"הצ'יפס מטוגן בציפסר שאינו סטרילי מגלוטן. גם קריספי בטטה באים במגע עם גלוטן."},
  {category:"אלרגנים וכשרות",question:"לקוח צליאקי רוצה קוקטייל. מה האופציה היחידה ללא גלוטן?",options:["אפרול שפריץ","פאשן ג'ין","כל הקוקטיילים מתאימים","קוקטייל ללא אלכוהול"],correct:3,explanation:"כל הקוקטיילים מכילים גלוטן (אלכוהול או מחיות). הקוקטייל היחיד ללא גלוטן הוא ללא אלכוהול."},
  {category:"אלרגנים וכשרות",question:"לקוח מזמין קרפצ'יו בקר ופלאפל כרובית. מה לבדוק?",options:["שמעדיף בשר צרוב או נא","שרוצה לחם לצד ההזמנה","שאין לו בעיה עם בשר וחלב ביחד","שלא רגיש לאגוזים"],correct:2,explanation:"כשלקוח מזמין מנות בשריות וחלביות יחד, יש לוודא שאין בעיה עם שילוב בשר וחלב. הפלאפל כרובית הוא חלבי."},
  {category:"אלרגנים וכשרות",question:"אלרגיה מסכנת חיים — מה הנוהל?",options:["להגיש רגיל ולהזהיר","להציע מנות סושי בלבד","לסרב לשרת את הלקוח","לפנות מיד למנהל המשמרת"],correct:3,explanation:"במקרה של אלרגיה מסכנת חיים — לפנות למנהל המשמרת. לא להחליט לבד."},
  {category:"אלרגנים וכשרות",question:"חציל בלאדי — בשרי, חלבי או טבעוני?",options:["בשרי","טבעוני","חלבי — מכיל טחינה-יוגורט","פרווה"],correct:2,explanation:"חציל בלאדי חלבי — מוגש על טחינה-יוגורט."},

  // ===== דגים נאים =====
  {category:"דגים נאים",question:"מה לומר ללקוח שמזמין סשימי סלמון?",options:["הדג מבושל לגמרי","המנה מגיעה עם לחם","הדג צרוב בברנר למעלה — נא ברובו","מדובר בדג לבן"],correct:2,explanation:"הסשימי סלמון עובר צריבה עם ברנר. הדג נשאר נא ברובו, רק בטופ צרוב קלות. חובה לציין ללקוח."},
  {category:"דגים נאים",question:"מנות הנאים מגיעות בלי לחם. מה להציע?",options:["להוסיף לחם הבית","ציפס אמריקאי","סלט קיסר","יין לבן"],correct:0,explanation:"כל מנות הדגים הנאים מגיעות בלי לחם. תמיד להציע להוסיף לחם הבית."},
  {category:"דגים נאים",question:"טוסטדה טונה אדומה — מהם המרכיבים העיקריים?",options:["טונה על מצע אורז","טונה בתוך לחם פיתה","טונה עם פסטה","טונה על טורטיית חיטה עם אבוקדו ואיולי פפריקה"],correct:3,explanation:"טוסטדה טונה אדומה: קוביות טונה אדומה טרייה על טורטיית חיטה, אבוקדו, בצל סגול, כוסברה, צנונית, צ'ילי ואיולי פפריקה ודבש."},
  {category:"דגים נאים",question:"סביצ'ה דג לבן — איזה דג?",options:["סלמון","טונה","לברק","דניס"],correct:2,explanation:"סביצ'ה דג לבן מוכנה מדג לברק."},

  // ===== ראשונות =====
  {category:"ראשונות",question:"לקוח הזמין צלעות תירס. מה לעשות מיד?",options:["להביא סלט","להביא לחם","לשים מפיות, מגבונים וקיסמים","לשאול אם רוצה ציפס"],correct:2,explanation:"ברגע שסיימנו עם ההזמנה של צלעות תירס — לשים מפיות, מגבונים וקיסמים בשולחן."},
  {category:"ראשונות",question:"לקוח מזמין ציפס. מה תמיד לשאול?",options:["אם רוצה ציפס בטטה","אם רוצה XL","אם רוצה קטשופ","אם להוסיף פטה — תוספת 8 ש\"ח"],correct:3,explanation:"תמיד לשאול אם רוצה תוספת פטה (8 ש\"ח)."},
  {category:"ראשונות",question:"פלאפל כרובית וכמהין — מה סוג המנה?",options:["בשרית","פרווה","טבעונית","חלבית — ממולא בגבינות"],correct:3,explanation:"פלאפל כרובית וכמהין הוא חלבי — כדורי כרובית במילוי גבינות וכמהין."},
  {category:"ראשונות",question:"מה מוגש בצד לחם הבית?",options:["חומוס וטחינה","חמאה בלבד","סלסה, שמן זית, בלסמי ושום קונפי","ממרח אבוקדו"],correct:2,explanation:"לחם הבית מוגש עם סלסה, שמן זית, בלסמי מצומצם ושום קונפי."},
  {category:"ראשונות",question:"מהי קריספי כרובית?",options:["כרובית מאודה עם טחינה","כרובית גולמית עם דיפ","כרובית בתנור עם שום","חצי כרובית מטוגנת עם איולי חרדל ולימון"],correct:3,explanation:"קריספי כרובית = חצי כרובית מטוגנת, איולי חרדל ולימון, טופינג פטרוזיליה."},

  // ===== עיקריות =====
  {category:"עיקריות",question:"לקוח מבקש אנטריקוט Well Done. מה לעשות?",options:["לקחת את ההזמנה כרגיל","לסרב ולהציע Medium","להגיש MW בלי לשאול","להסביר שאין נקודת אל חזור מ-WD, אבל לכבד אם מתעקש"],correct:3,explanation:"לא להציע WD כי אין נקודת אל חזור. MW אפשר להחזיר לאש. אם מתעקש — להסביר ולכבד."},
  {category:"עיקריות",question:"פיצה נפוליטנה — תוספות אפשריות ובכמה?",options:["שום ובזיליקום חינם","אין אופציה לתוספות","זיתים/פטריות/פטה/בצל/עגבניה — 8 ש\"ח","רק פטריות — 12 ש\"ח"],correct:2,explanation:"תוספות לפיצה: זיתים/פטריות/פטה/בצל/עגבניה — 8 ש\"ח."},
  {category:"עיקריות",question:"טוסטדה שווארמה סויה — האם המנה בשרית?",options:["כן, מכילה בשר","לא, טבעונית לגמרי","כן, שווארמה עוף","לא, מכילה שווארמה סויה — צמחונית"],correct:3,explanation:"טוסטדה שווארמה סויה מכילה שווארמה סויה ופטריות — לא בשרית. אבל מכילה איולי אז צמחונית ולא טבעונית."},
  {category:"עיקריות",question:"מה מוגש לצד סטייק פרגית?",options:["ציפס אמריקאי","סלט ירוק","ירקות שורש בתנור — תפו\"א, בטטה, בצל מקורמל","אורז לבן"],correct:2,explanation:"סטייק פרגית מוגש לצד ירקות שורש בתנור — תפו\"א, בטטה ובצל מקורמל."},
  {category:"עיקריות",question:"טורטליני דבש וערמונים — מה הרוטב?",options:["רוטב עגבניות","רוטב שמנת קרמי עם תרד וטימין","רוטב פסטו","רוטב בשמל"],correct:1,explanation:"טורטליני דבש וערמונים מוגשים ברוטב שמנת קרמי עם תרד וטימין, דלעת צלויה ופרמז'ן."},

  // ===== שינויים במנות =====
  {category:"שינויים במנות",question:"שינוי דרסטי במנה — מה להסביר ללקוח?",options:["אין בעיה, הכל אפשרי","זה פוגע בטעם, ולאחר ההורדה לא ניתן לבטל","לסרב באופן מוחלט","רק מנהל יכול לאשר"],correct:1,explanation:"שינויים דרסטיים פוגעים בטעם המקורי. יש להסביר שלא נוכל להחזיר/לבטל את המנה."},

  {category:"סלטים",question:"באיזה סלט יש פקאן מסוכר?",options:["סלט שרי","סלט ברי","סלט אנדיב פרימוורה","סלט קיסר"],correct:2,explanation:"סלט אנדיב פרימוורה כולל פקאן מסוכר, קריספי בטטה, אגוזים וגבינת עזים."},

  {category:"עיקריות",question:"מה מלווה את המבורגר פסאו?",options:["סלט ירוק","אורז","צ'יפס","ירקות שורש"],correct:2,explanation:"המבורגר פסאו מוגש בתוספת צ'יפס, עם ריבת בצל, עגבניה, חסה ואיולי פפריקה ודבש."},

  {category:"סושי",question:"דרגון רול — מה מרכיביו?",options:["טונה, אבוקדו ומלפפון","דניס, אושינקו וטוביקו ירוק","סלמון נא, אספרגוס וספייסי מיונז","סלמון אפוי, שיטאקי, קמפיו, בטטה, מעטפת קריספי בטטה"],correct:3,explanation:"דרגון רול = סלמון אפוי, שיטאקי, קמפיו, בטטה, מעטפת שבבי קריספי בטטה."},
  {category:"סושי",question:"מה הדג ברול לונה?",options:["סלמון","טונה","דניס","לברק"],correct:2,explanation:"לונה = דניס טרי, מלפפון, אושינקו, מעטפת דניס, טוביקו ירוק, גרידת לימון, איולי יוזו."},
  {category:"סושי",question:"כמה סוגי דגים יש במעטפת ריינבואו?",options:["שלושה — דניס, סלמון וטונה","סוג אחד — סלמון","שניים — סלמון וטונה","ארבעה — דניס, סלמון, טונה ולברק"],correct:0,explanation:"ריינבואו = מלפפון, בטטה, אבוקדו, עירית, מעטפת 3 סוגי דגים — דניס, סלמון וטונה."},
  {category:"סושי",question:"ווג'י בטטה ואבוקדו — מה עוד יש ברול?",options:["אושינקו","קמפיו ואספרגוס","ספייסי מיונז","טוביקו"],correct:0,explanation:"ווג'י בטטה ואבוקדו = אושינקו, בטטה ואבוקדו טופ."},
  {category:"סושי",question:"במה עטוף ווג'י סלק?",options:["נורי רגיל","מעטפת סלמון","צ'יפס סלק","קריספי בטטה"],correct:2,explanation:"ווג'י סלק = אבוקדו, מלפפון, קמפיו, עירית, אספרגוס, במעטפת צ'יפס סלק."},
  {category:"סושי",question:"גולדן סלמון רול — מה הטופינג?",options:["טוביקו שחור ואיולי כמהין","ספייסי מיונז ועירית","מעטפת דניס וטוביקו ירוק","סלמון צרוב, טריאקי ושקדים"],correct:3,explanation:"גולדן סלמון רול = בטטה, ספייסי מיונז, אבוקדו, מלפפון, סלמון צרוב, טריאקי ושקדים."},
  {category:"סושי",question:"מה המרכיב הייחודי ב-black & lemon שלא נמצא ברולים אחרים?",options:["ספייסי מיונז","איולי וואסבי","טוגראשי","צ'אנק לימון ואיולי כמהין"],correct:3,explanation:"black & lemon = סלמון טרי, מלפפון, אבוקדו, צ'אנק לימון, ספייסי מיונז, מעטפת סלמון, טוביקו שחור, איולי כמהין. צ'אנק לימון ואיולי כמהין ייחודיים לרול זה."},

  {category:"סושי",question:"לקוח רוצה לונה רול עם דג אפוי. מה עונים?",options:["בטח, נעשה אפוי","נציע דרגון רול במקום","רק אם מנהל מאשר","לונה מכילה דניס — דג לבן תמיד נא, אי אפשר לשנות"],correct:3,explanation:"כל הרולים עם דג לבן (כמו דניס) הם דג נא ואין אפשרות לשנות. רק ברולים עם סלמון אפשר לבחור אפוי או נא."},
  {category:"קוקטיילים",question:"סמבוקה קיס — על בסיס מה?",options:["רום לבן ולימון","סן ג'רמן, פרוסקו וסודה — מתוק, פרחוני ורך","וודקה ופסיפלורה","ג'ין ומלפפון"],correct:1,explanation:"סמבוקה קיס = על בסיס סן ג'רמן, פרוסקו וסודה. קוקטייל מתוק מרענן, טעם פרחוני, רך ואלגנטי."},
  {category:"קוקטיילים",question:"צ'ויה שפריץ — מה הבסיס שלו?",options:["ג'ין ולימון","טקילה ומנגו","וודקה והיביסקוס","אומשו, שרבט לימון ופרוסקו"],correct:3,explanation:"צ'ויה שפריץ = על בסיס אומשו, שרבט לימון ופרוסקו. קוקטייל מרענן, מתקתק עם טעמים אסייתים עמוקים."},
  {category:"קוקטיילים",question:"פלומה בייבי — מה הבסיס?",options:["וודקה וליים","ג'ין ופרוסקו","טקילה, ליים, אפרול, קמפרי, אגבה וסיידר אשכולית","רום ואננס"],correct:2,explanation:"פלומה בייבי = טקילה, ליים, אפרול, קמפרי, אגבה וסיידר אשכולית מוגזת. קוקטייל קליל מוגז עם חמיצות ומתיקות."},
  {category:"קוקטיילים",question:"לולו שפריץ — מה הרכבו?",options:["אפרול, פרוסקו וסודה","ג'ין, לימון וקאווה","טקילה, מנגו ופסיפלורה","אומפון, ג'ין, קורדיאל תפוז וסודה"],correct:3,explanation:"לולו שפריץ = אומפון, ג'ין, קורדיאל תפוז וסודה. משקה תוסס תפוזי, ארומטי ומרענן."},
  {category:"קוקטיילים",question:"פרנץ' 75 — על בסיס מה?",options:["ג'ין, קורדיאל לימון, לימון וקאווה","רום לבן ונענע","וודקה ואשכולית","טקילה ומיץ לימון"],correct:0,explanation:"פרנץ' 75 = ג'ין, קורדיאל לימון, לימון וקאווה. קוקטייל אלגנטי, לימוני וחמצמץ, חזק למרות עדינותו."},
  {category:"קוקטיילים",question:"לקוח מבקש קוקטייל מתוק ופרחוני. מה להמליץ?",options:["נגרוני","אפרול שפריץ","מרגריטה","פינק ליידי"],correct:3,explanation:"פינק ליידי = ג'ין מאלפי רוזה, מתקתק, משלב טעמי פירות אדומים עם ליצ'י. מתוק ופרחוני."},
  {category:"קוקטיילים",question:"סיאסטה — על בסיס מה?",options:["רום לבן ורום כהה, סירופ נענע, לימון ואננס","ג'ין ופסיפלורה","וודקה והיביסקוס","טקילה ומנגו"],correct:0,explanation:"סיאסטה = רום לבן, רום כהה, סירופ נענע טרייה, לימון ואננס. קוקטייל מתקתק."},
  {category:"קוקטיילים",question:"קוקטייל ללא אלכוהול — ממה הוא עשוי?",options:["סודה עם לימון","רוטב פסיפלורה בלבד","מיקס אבטיח ואננס","מיץ תפוזים בלבד"],correct:2,explanation:"קוקטייל ללא אלכוהול = מיקס אבטיח ואננס, סגירה של מיץ תפוזים."},
  {category:"יין",question:"איזה יין לבן כשר יש בתפריט?",options:["שבלי אלברט בישו","שרדונה וילה קייפ, גוורץ לה פיאצה וסובניון בלאן לה וי","פינו גריג'ו","כולם כשרים"],correct:1,explanation:"שלושה יינות לבנים כשרים: שרדונה וילה קייפ, גוורצטרמינר לה פיאצה וסובניון בלאן לה וי. שבלי ופינו גריג'ו אינם כשרים."},
  {category:"יין",question:"מה הצבע של יין רוזה טי אמו?",options:["לבן","אדום","רוזה","מבעבע"],correct:2,explanation:"טי אמו הוא יין רוזה. גם וויספרינג אנג'ל ורוזה קסטל הם רוזה."},
  {category:"יין",question:"קאווה בוטגה גולד — מה סוג היין?",options:["אדום יבש","רוזה מתוק","לבן שקט","לבן יבש מבעבע"],correct:3,explanation:"קאווה בוטגה גולד = יין לבן יבש מבעבע."},
  {category:"יין",question:"פינו נואר — מה סוג היין?",options:["לבן יבש","אדום קליל ופירותי","רוזה","מבעבע"],correct:1,explanation:"פינו נואר = יין אדום קליל, עדין ופירותי מעמק הלואר, עם ארומות של דובדבן ופטל שחור."},
  {category:"יין",question:"מואט שנדו — איזה גרסאות יש בתפריט?",options:["רק ברוט לבן","רק רוזה ברוט","ברוט לבן ורוזה ברוט","רק בכוס"],correct:2,explanation:"בתפריט יש מואט שנדו ברוט (לבן) ומואט שנדו רוזה ברוט."},
  {category:"יין",question:"גוורצטרמינר לה פיאצה — לאיזה מנות מומלץ?",options:["מנות בשריות כבדות","מנות פתיחה קלות ומנות מהמטבח האסייתי","קינוחים","סלטים בלבד"],correct:1,explanation:"גוורצטרמינר לה פיאצה מומלץ להגשה לצד מנות פתיחה קלות וגם מנות מהמטבח האסייתי."},
  {category:"שתייה חריפה",question:"איזו וודקה פרימיום יש בתפריט?",options:["בלוגה ובלוגה טרנס אטלנטיק","אבסולוט בלבד","סטולי בלבד","גריי גוז"],correct:0,explanation:"וודקות פרימיום בתפריט: בלוגה ובלוגה טרנס אטלנטיק, לצד אבסולוט וסטולי."},
  {category:"שתייה חריפה",question:"דון חוליו 1942 — מה סוג השתייה?",options:["וויסקי","רום","ג'ין","טקילה"],correct:3,explanation:"דון חוליו 1942 היא טקילה פרימיום. יש גם דון חוליו בלאנקו ורפוסדו."},
  {category:"שתייה חריפה",question:"מקאלן 12 — מה זה?",options:["וויסקי סינגל מאלט","טקילה","קוניאק","רום"],correct:0,explanation:"מקאלן 12 הוא וויסקי סינגל מאלט סקוטי. נמצא בקטגוריית הוויסקי בתפריט."},
  {category:"שתייה חריפה",question:"הנסי — באילו גרסאות יש בתפריט?",options:["VS בלבד","VS, VSOP ו-XO","VSOP בלבד","XO בלבד"],correct:1,explanation:"קוניאק הנסי קיים בתפריט בשלוש גרסאות: VS, VSOP ו-XO."},

  {category:"שתייה חריפה",question:"וואן גוך — מה סוג המשקה ומה הטעמים?",options:["וודקה בטעמי אננס, אסאי וליצ'י-אבטיח","ג'ין בטעם פירות","רום בטעם קוקוס","טקילה בטעם מנגו"],correct:0,explanation:"וואן גוך = וודקה בטעמים: אננס, אסאי וליצ'י-אבטיח."},
  {category:"בירות",question:"אילו בירות מוגשות מהחבית?",options:["היינקן, גולדסטאר ופאולנר","סטלה, סול וליפמנס","רק היינקן","כולן מהחבית"],correct:0,explanation:"מהחבית (שליש): היינקן, גולדסטאר ופאולנר. בבקבוק: סטלה, סטורנגבו, סול וליפמנס."},
  {category:"בירות",question:"סטלה — מהחבית או בקבוק?",options:["מהחבית","בקבוק","שניהם","לא קיימת בתפריט"],correct:1,explanation:"סטלה מוגשת בבקבוק. מהחבית יש היינקן, גולדסטאר ופאולנר."},
  {category:"בירות",question:"איזו בירה מקסיקנית יש בתפריט?",options:["קורונה","סול","דוס אקיס","מודלו"],correct:1,explanation:"סול היא הבירה המקסיקנית בתפריט, מוגשת בבקבוק."},
  {category:"בראנץ'",question:"שקשוקה עגבניות — מה מלווה אותה?",options:["סלט ולחם וטחינה","ציפס ורוטב","גבינות ומאפים","ביצה עלומה וסלט"],correct:0,explanation:"שקשוקה עגבניות קלאסית מוגשת עם סלט, לחם וטחינה."},
  {category:"בראנץ'",question:"טוסט סלמון — מה כולל?",options:["סלמון מעושן בלבד על לחם","קרם פרש, רוקט, סלמון וצנונית","סלמון אפוי עם אבוקדו","סלמון, גבינה צהובה וביצה"],correct:1,explanation:"טוסט סלמון = קרם פרש, רוקט, סלמון, צנונית."},
  {category:"בראנץ'",question:"קרפצ'יו סלק — האם קיים גם בתפריט הבראנץ'?",options:["לא, רק בתפריט הערב","כן, קיים בבראנץ' — עם גבינת עזים","רק בסופ\"ש","כן, אבל בגרסה שונה"],correct:1,explanation:"קרפצ'יו סלק וגבינת עזים מופיע גם בתפריט הבראנץ' — בצל ירוק, שמן זית ולימון, בלסמי מצומצם, מיקס עלים."},
  {category:"תפריט ילדים",question:"מה כולל תפריט הילדים?",options:["רק פסטה ופיצה","המבורגר, שניצל ופיצה","ספגטי עגבניות, נאגטס עוף, פיצה נפוליטנה ופיש אנד צ'יפס","סושי ילדים ופסטה"],correct:2,explanation:"תפריט ילדים: ספגטי עגבניות, נאגטס עוף (עם צ'יפס), פיצה נפוליטנה ופיש אנד צ'יפס."},
  {category:"תפריט ילדים",question:"נאגטס עוף בתפריט ילדים — מה מלווה אותם?",options:["סלט ירוק","אורז לבן","פיוריי תפוחי אדמה","צ'יפס"],correct:3,explanation:"נאגטס עוף = נתחי עוף בטמפורה פריכה בליווי צ'יפס."},
  {category:"תפריט ילדים",question:"ספגטי עגבניות ילדים — מה הרוטב?",options:["רוטב עגבניות עשיר","רוטב שמנת","רוטב פסטו","רוטב בולונז"],correct:0,explanation:"ספגטי עגבניות = ספגטי ברוטב עגבניות עשיר."},
  {category:"כללי",question:"לקוח מבקש להוציא תיבול מסלט. מה להגיד?",options:["אין בעיה כלל","לאשר רק עם מנהל","זה עלול לשנות את טעם המנה — להסביר שלא ניתן יהיה להחזיר","לסרב לחלוטין"],correct:2,explanation:"הוצאת תיבול מסלט עלולה לשנות את טעם המנה. יש להסביר ללקוח שלאחר השינוי לא ניתן להחזיר או לבטל."},
  {category:"כללי",question:"הסושי מוגש באילו ימים?",options:["ראשון, שישי ושבת","כל יום","חמישי עד שבת","רק שישי ושבת"],correct:0,explanation:"סושי מוגש בימי ראשון, שישי ושבת."},
  {category:"כללי",question:"צלעות תירס — איך הן מוכנות בתפריט המעודכן?",options:["צלויות על הגריל","מוקפצות בחמאת שום, פפריקות ועשבי תיבול, טופינג פרמזן","מטוגנות בשמן עמוק","אפויות בתנור"],correct:1,explanation:"צלעות תירס מוקפצות בחמאת שום, פפריקות ועשבי תיבול, עם טופינג פרמזן."},
  {category:"אלרגנים וכשרות",question:"קריספי בטטה בסושי — האם מכיל גלוטן?",options:["כן — קריספי בטטה בא במגע עם גלוטן","לא, בטטה ללא גלוטן","רק אם מטוגן","תלוי ברול"],correct:0,explanation:"קריספי בטטה וקריספי סלק באים במגע עם גלוטן. חשוב לציין זאת ללקוחות צליאקים."},
  {category:"אלרגנים וכשרות",question:"סלמון אפוי בסושי — למה הוא בעייתי לצליאקים?",options:["הסלמון אפוי עובר בישול בטריאקי שמכיל גלוטן","הסלמון עצמו מכיל גלוטן","האורז מכיל גלוטן","אין בעיה, מתאים לצליאקים"],correct:0,explanation:"סלמון אפוי עובר בישול בטריאקי — רוטב טריאקי מכיל גלוטן. חשוב לציין זאת ללקוחות צליאקים."},
  {category:"אלרגנים וכשרות",question:"לקוח שואל אם יש סויה ללא גלוטן לסושי. מה עונים?",options:["אין דבר כזה","לא קיים אצלנו","כן, אפשר להביא ללקוח סויה ללא גלוטן","רק אם מביא מהבית"],correct:2,explanation:"יש אופציה לרוטב סויה ללא גלוטן להביא ללקוח."},
  {category:"אלרגנים וכשרות",question:"לקוח מזמין קרפצ'יו סלק וצלעות תירס. צריך לבדוק משהו?",options:["לא, שתי המנות פרווה","כן — קרפצ'יו סלק חלבי וצלעות תירס עם פרמזן, לבדוק שאין בעיה","כן — צלעות תירס בשריות","רק אם הלקוח כשר"],correct:1,explanation:"קרפצ'יו סלק מכיל גבינת עזים (חלבי), וצלעות תירס כוללות טופינג פרמזן (גם חלבי). שתי המנות חלביות אז אין בעיה של בשר וחלב, אבל טוב לוודא."},
  {category:"קינוחים",question:"קרם ברולה — מה כוללת המנה?",options:["תחתית קראמבל, קרם ברולה וקולי פסיפלורה","רק קרם ברולה קלאסי","קרם ברולה עם פירות יער","קרם ברולה עם שוקולד"],correct:0,explanation:"קרם ברולה = תחתית קראמבל, קרם ברולה, קולי פסיפלורה."},
  {category:"קינוחים",question:"טירמיסו די פסאו — מה הרוטב שמלווה?",options:["רוטב שוקולד","רוטב קפוצ'ינו","רוטב קרמל","רוטב וניל"],correct:1,explanation:"טירמיסו די פסאו = שכבות עוגיות בישקוטי, קרם מסקרפונה, קקאו, רוטב קפוצ'ינו."},
];

// Shuffle helper
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const letters = ['א', 'ב', 'ג', 'ד'];

let state = {
  screen: 'start', // start | quiz | results
  questions: [],
  current: 0,
  answers: [], // { selected, correct }
  answered: false,
};

function init() {
  // Pick QUIZ_SIZE random questions from the full bank
  state.questions = shuffle(QUESTIONS).slice(0, QUIZ_SIZE);
  state.current = 0;
  state.answers = [];
  state.answered = false;
  state.screen = 'start';
  render();
}

function startQuiz() {
  state.screen = 'quiz';
  render();
}

function selectAnswer(idx) {
  if (state.answered) return;
  state.answered = true;
  const q = state.questions[state.current];
  state.answers.push({ selected: idx, correct: q.correct });
  render();
}

function nextQuestion() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    state.answered = false;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    state.screen = 'results';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function restart() {
  init();
  startQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'start') {
    renderStart(app);
  } else if (state.screen === 'quiz') {
    renderQuiz(app);
  } else {
    renderResults(app);
  }
}

function renderStart(app) {
  const categories = [...new Set(QUESTIONS.map(q => q.category))];
  app.innerHTML = `
    <div class="header">
      <img class="header-logo" src="https://raw.githubusercontent.com/yarinamrani/paseo-event-maker/main/icon-512.png" alt="Paseo Logo">
      <h1>מבחן תפריט פסאו</h1>
      <div class="subtitle">למלצרים וברמנים חדשים</div>
    </div>
    <div class="start-card">
      <h2>מוכנים לבדוק את הידע? 🍽️</h2>
      <div class="start-info">
        <div class="info-item">
          <div class="info-num">${QUIZ_SIZE}</div>
          <div class="info-label">שאלות במבחן</div>
        </div>
        <div class="info-item">
          <div class="info-num">80%</div>
          <div class="info-label">ציון עובר</div>
        </div>
        <div class="info-item">
          <div class="info-num">${categories.length}</div>
          <div class="info-label">נושאים</div>
        </div>
      </div>
      <div class="topics-list">
        ${categories.map(c => `<span class="topic-tag">${c}</span>`).join('')}
      </div>
      <button class="nav-btn primary" onclick="startQuiz()">התחל מבחן ←</button>
    </div>
  `;
}

function renderQuiz(app) {
  const q = state.questions[state.current];
  const total = state.questions.length;
  const progress = ((state.current + (state.answered ? 1 : 0)) / total) * 100;

  let optionsHtml = q.options.map((opt, i) => {
    let cls = 'option-btn';
    if (state.answered) {
      cls += ' disabled';
      if (i === state.answers[state.current]?.selected && i === q.correct) {
        cls += ' selected-correct';
      } else if (i === state.answers[state.current]?.selected && i !== q.correct) {
        cls += ' selected-wrong';
      } else if (i === q.correct) {
        cls += ' show-correct';
      }
    }
    return `<button class="${cls}" onclick="selectAnswer(${i})">
      <span class="option-letter">${letters[i]}</span>
      <span>${opt}</span>
    </button>`;
  }).join('');

  let explanationHtml = '';
  if (state.answered) {
    const isCorrect = state.answers[state.current].selected === q.correct;
    explanationHtml = `
      <div class="explanation">
        <strong>${isCorrect ? '✅ נכון!' : '❌ לא נכון.'}</strong><br>
        ${q.explanation}
      </div>
    `;
  }

  let navHtml = '';
  if (state.answered) {
    const isLast = state.current === total - 1;
    navHtml = `
      <div class="nav-row">
        <button class="nav-btn primary" onclick="nextQuestion()">
          ${isLast ? 'לתוצאות' : 'שאלה הבאה'} ←
        </button>
        <span style="font-size:0.85rem;color:#999;">${state.current + 1} / ${total}</span>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="header">
      <img class="header-logo" src="https://raw.githubusercontent.com/yarinamrani/paseo-event-maker/main/icon-512.png" alt="Paseo Logo">
      <h1>מבחן תפריט פסאו</h1>
      <div class="subtitle">למלצרים וברמנים חדשים</div>
    </div>
    <div class="progress-container">
      <div class="progress-text">${state.current + 1} / ${total}</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width:${progress}%"></div>
      </div>
    </div>
    <div class="question-card">
      <span class="question-category">${q.category}</span>
      <div class="question-text">${q.question}</div>
      <div class="options">${optionsHtml}</div>
      ${explanationHtml}
      ${navHtml}
    </div>
  `;
}

function renderResults(app) {
  const total = state.questions.length;
  const correct = state.answers.filter(a => a.selected === a.correct).length;
  const pct = Math.round((correct / total) * 100);
  const passed = pct >= 80;

  // Category breakdown
  const catMap = {};
  state.questions.forEach((q, i) => {
    if (!catMap[q.category]) catMap[q.category] = { total: 0, correct: 0 };
    catMap[q.category].total++;
    if (state.answers[i] && state.answers[i].selected === q.correct) {
      catMap[q.category].correct++;
    }
  });

  let catHtml = Object.entries(catMap).map(([cat, data]) => {
    const catPct = Math.round((data.correct / data.total) * 100);
    return `<div class="cat-row">
      <span>${cat}</span>
      <span class="cat-score ${catPct >= 75 ? 'good' : 'bad'}">${data.correct}/${data.total} (${catPct}%)</span>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="header">
      <img class="header-logo" src="https://raw.githubusercontent.com/yarinamrani/paseo-event-maker/main/icon-512.png" alt="Paseo Logo">
      <h1>מבחן תפריט פסאו</h1>
      <div class="subtitle">תוצאות</div>
    </div>
    <div class="results-card">
      <div class="score-circle ${passed ? 'pass' : 'fail'}">
        <div class="score-number">${pct}%</div>
        <div class="score-label">${correct} מתוך ${total}</div>
      </div>
      <div class="results-title">${passed ? 'עברת בהצלחה! 🎉' : 'צריך עוד תרגול 📚'}</div>
      <div class="results-subtitle">
        ${passed
          ? 'מוכן/ה להתחיל התלמדות. יש לחזור על הנושאים שטעית בהם.'
          : 'ציון עובר הוא 80%. יש לחזור על החומר ולנסות שוב.'}
      </div>
      <div class="category-breakdown">
        <h3>פירוט לפי נושאים:</h3>
        ${catHtml}
      </div>
      <button class="nav-btn primary" onclick="restart()">נסה שוב ←</button>
    </div>
  `;
}

init();
</script>
</body>
</html>
